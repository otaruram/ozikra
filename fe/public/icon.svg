<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bunkerBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1d3524" />
      <stop offset="65%" stop-color="#112016" />
      <stop offset="100%" stop-color="#0a130d" />
    </radialGradient>
    <linearGradient id="brassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d97e" />
      <stop offset="50%" stop-color="#d8b152" />
      <stop offset="100%" stop-color="#9e7822" />
    </linearGradient>
    <linearGradient id="starGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3" />
      <stop offset="45%" stop-color="#ecc560" />
      <stop offset="100%" stop-color="#b88928" />
    </linearGradient>
  </defs>

  <!-- Rounded Military Badge Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b140e" stroke="#294231" stroke-width="1.5" />

  <!-- Outer Kartika Cyber Defense Shield (Brass-Gold Bevel) -->
  <path
    d="M32 6 L55 15.5 V33.5 C55 46.5 45.2 55.2 32 59 C18.8 55.2 9 46.5 9 33.5 V15.5 L32 6 Z"
    fill="url(#bunkerBg)"
    stroke="url(#brassRim)"
    stroke-width="3"
    stroke-linejoin="miter"
  />

  <!-- Inner Tactical Cyber Emerald Perimeter & Reticle -->
  <path
    d="M32 10.5 L50.5 18.2 V33 C50.5 43.4 42.6 50.6 32 54 C21.4 50.6 13.5 43.4 13.5 33 V18.2 L32 10.5 Z"
    fill="none"
    stroke="#59ba82"
    stroke-width="1.4"
    stroke-dasharray="5 2.5"
    opacity="0.9"
  />

  <!-- Cyber Crosshair & Radar Ring -->
  <circle cx="32" cy="32" r="15" stroke="#59ba82" stroke-width="1" stroke-opacity="0.45" />
  <line x1="32" y1="11" x2="32" y2="16" stroke="#59ba82" stroke-width="1.6" />
  <line x1="32" y1="48" x2="32" y2="53" stroke="#59ba82" stroke-width="1.6" />
  <line x1="14" y1="32" x2="19" y2="32" stroke="#59ba82" stroke-width="1.6" />
  <line x1="45" y1="32" x2="50" y2="32" stroke="#59ba82" stroke-width="1.6" />

  <!-- Iconic 5-Pointed Kartika Eka Paksi Gold Star (TNI-AD) -->
  <polygon
    points="32,14.5 36.6,25.6 48.6,26.4 39.3,34.1 42.3,45.8 32,39.3 21.7,45.8 24.7,34.1 15.4,26.4 27.4,25.6"
    fill="url(#starGold)"
    stroke="#0b140e"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Inner Star Facet Highlights & Cyber Core -->
  <polygon
    points="32,17.2 35.4,26.4 45.2,27 37.6,33.3 39.8,42.8 32,37.8"
    fill="#fff6cc"
    fill-opacity="0.32"
  />
  <circle cx="32" cy="31.8" r="3.2" fill="#0d1a12" stroke="#59ba82" stroke-width="1.5" />
  <circle cx="32" cy="31.8" r="1.3" fill="#59ba82" />
</svg>
