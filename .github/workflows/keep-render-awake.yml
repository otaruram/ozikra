name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          for i in 1 2 3; do
            curl -fsSL --max-time 30 "https://ozik-sentinel.onrender.com/api/v1/health" || true
            echo ""
            if [ "$i" -lt 3 ]; then sleep 90; fi
          done
